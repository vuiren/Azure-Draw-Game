name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'server/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr login --name drawgame
          docker build -t drawgame.azurecr.io/api:${{ github.sha }} ./server
          docker push drawgame.azurecr.io/api:${{ github.sha }}

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name drawguess-api \
            --resource-group Azure_Draw_Game \
            --image drawgame.azurecr.io/api:${{ github.sha }}