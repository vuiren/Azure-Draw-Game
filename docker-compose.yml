services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build: ./server
    ports:
      - "5296:8080"
    environment:
      - ConnectionStrings__Redis=redis:6379
      - Cors__AllowedOrigins__0=http://localhost:5173
    depends_on:
      - redis

  client:
    build: 
      context: ./client
      args:
        VITE_API_URL: http://localhost:5296
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  redis-data: